async function decodePack(P) {
  const bin = Uint8Array.from(atob(P.blob), c => c.charCodeAt(0));
  const raw = new Uint8Array(await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  const recs = P.recs.map(r => {
    const pos = new Float32Array(r.n * 3);
    for (let k = 0; k < r.n * 3; k++) pos[k] = r.mn[k % 3] + raw[r.o + k] * r.sc[k % 3];
    return { p: pos, i: new Uint16Array(raw.slice(r.io, r.io + r.m * 2).buffer) };
  });
  const geos = {};
  P.meta.char.meshes.forEach(m => { if (!geos[m.geo]) geos[m.geo] = recs[m.r]; });
  return {
    char: { bones: P.meta.char.bones, meshes: P.meta.char.meshes.map(m => ({ ...m, geo: m.geo })), geos },
    weapons: P.meta.weapons.map(w => ({ key: w.key, parts: w.parts.map(pt => ({ ...recs[pt.r], color: pt.color, rough: pt.rough, metal: pt.metal })) }))
  };
}

/* ---------- Geometria e materiais exportados ---------- */
const GEO = {};
function geoOf(key) {
  if (!GEO[key]) {
    const g = DATA.char.geos[key];
    const bg = new T.BufferGeometry();
    bg.setAttribute('position', new T.Float32BufferAttribute(g.p, 3));
    if (g.n) bg.setAttribute('normal', new T.Float32BufferAttribute(g.n, 3));
    if (g.i) bg.setIndex(new T.BufferAttribute(g.i, 1));
    if (!g.n) bg.computeVertexNormals();
    GEO[key] = bg;
  }
  return GEO[key];
}
const MATS = {};
function matOf(m) {
  const k = [m.color, m.rough, m.metal, m.emi, m.emiI, m.opa, m.tr].join('|');
  return MATS[k] || (MATS[k] = new T.MeshStandardMaterial({
    color: m.color, roughness: m.rough, metalness: m.metal, emissive: m.emi,
    emissiveIntensity: m.emiI, transparent: m.tr, opacity: m.opa, side: T.DoubleSide }));
}

/* ---------- Rig do personagem (ossos reais + mãos adicionadas nos cotovelos) ---------- */
function buildRig() {
  const rig = new T.Group();
  rig.name = 'Character_Root';
  const B = { Character_Root: rig };
  const pending = Object.assign({}, DATA.char.bones);
  pending.Bone_Hand_R = { parent: 'Bone_Elbow_R', pos: [0, -1.26, 0], quat: [0, 0, 0, 1] };
  pending.Bone_Hand_L = { parent: 'Bone_Elbow_L', pos: [0, -1.26, 0], quat: [0, 0, 0, 1] };
  for (let pass = 0; pass < 20 && Object.keys(pending).length; pass++) {
    for (const n of Object.keys(pending)) {
      const b = pending[n];
      if (!B[b.parent]) continue;
      const o = new T.Group();
      o.name = n;
      o.position.fromArray(b.pos);
      o.quaternion.fromArray(b.quat);
      B[b.parent].add(o);
      B[n] = o;
      delete pending[n];
    }
  }
  for (const m of DATA.char.meshes) {
    const mesh = new T.Mesh(geoOf(m.geo), matOf(m));
    mesh.applyMatrix4(new T.Matrix4().fromArray(m.M));
    mesh.castShadow = true;
    (B[m.bone] || rig).add(mesh);
  }
  return { rig, B };
}

/* ---------- Armas e escudo da vitrine (geometria real) ---------- */
const WEAPON_KEYS = { 'Khopesh': 'khopesh', 'Espada reta': 'reta', 'Espada curva': 'curva', 'Adaga': 'adaga', 'Machado': 'machado', 'Escudo': 'escudo' };
function weaponGroup(key) {
  const w = DATA.weapons.find(x => x.key === key);
  const parts = w.parts; // o pedestal da vitrine já foi removido no pacote
  let minY = 1e9, maxY = -1e9;
  for (const pt of parts) for (let k = 1; k < pt.p.length; k += 3) { minY = Math.min(minY, pt.p[k]); maxY = Math.max(maxY, pt.p[k]); }
  const isShield = key === 'escudo';
  const dy = isShield ? (minY + maxY) / 2 : minY + 0.35; // origem: centro do escudo ou ponto de pegada
  const grp = new T.Group();
  for (const pt of parts) {
    const p = new Float32Array(pt.p);
    for (let k = 1; k < p.length; k += 3) p[k] -= dy;
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.BufferAttribute(p, 3));
    g.computeVertexNormals();
    if (pt.i) g.setIndex(new T.BufferAttribute(pt.i, 1));
    const m = new T.MeshStandardMaterial({ color: pt.color, roughness: pt.rough, metalness: pt.metal, side: T.DoubleSide });
    const mesh = new T.Mesh(g, m);
    mesh.castShadow = true;
    grp.add(mesh);
  }
  return { grp, L: isShield ? 0 : maxY - dy };
}

/* ---------- Matemática de articulações (IK em dois ossos) ---------- */
const _inv = new T.Matrix4();
function solveChain(root, mid, end, target, pole) {
  root.parent.updateWorldMatrix(true, false);
  const S = root.getWorldPosition(new T.Vector3());
  const l1 = mid.position.length() * SCALE, l2 = end.position.length() * SCALE; // comprimentos em unidades de mundo
  const dv = target.clone().sub(S);
  let d = Math.min(dv.length(), (l1 + l2) * 0.9995);
  const u = dv.clone().normalize();
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const p = pole.clone().addScaledVector(u, -pole.dot(u)).normalize();
  const Mw = S.clone().addScaledVector(u, a).addScaledVector(p, h);
  _inv.copy(root.parent.matrixWorld).invert();
  const dirLocal = Mw.clone().sub(S).normalize().transformDirection(_inv);
  root.quaternion.setFromUnitVectors(mid.position.clone().normalize(), dirLocal);
  root.updateWorldMatrix(true, false);
  const E = mid.getWorldPosition(new T.Vector3());
  _inv.copy(root.matrixWorld).invert();
  const dir2 = target.clone().sub(E).normalize().transformDirection(_inv);
  mid.quaternion.setFromUnitVectors(end.position.clone().normalize(), dir2);
  mid.updateWorldMatrix(true, false);
}
// Orientação de um osso terminal (mão) em coordenadas de mundo.
function orientEnd(end, qWorld) {
  const pq = end.parent.getWorldQuaternion(new T.Quaternion());
  end.quaternion.copy(pq.invert().multiply(qWorld));
}
// Quaternion com eixo 'y' = p (lâmina) ou 'z' = p (face do escudo), e o outro eixo próximo de hint.
function quatFrame(mode, p, hint) {
  const P = p.clone().normalize();
  let H = hint.clone().addScaledVector(P, -hint.dot(P));
  if (H.length() < 1e-4) H = Math.abs(P.y) < 0.9 ? new T.Vector3(0, 1, 0) : new T.Vector3(1, 0, 0);
  H.normalize();
  let x, y, z;
  if (mode === 'y') { y = P; z = H; x = new T.Vector3().crossVectors(y, z).normalize(); }
  else { z = P; y = H; x = new T.Vector3().crossVectors(y, z).normalize(); }
  return new T.Quaternion().setFromRotationMatrix(new T.Matrix4().makeBasis(x, y, z));
}

/* ---------- Personagens ---------- */
const GUARD = { hip: [0, 0, 0], sp: [0.05, 0, 0], nk: [-0.05, 0, 0], Rg: [-0.9, 5.3, 2.3], Rd: [0.2, 0.85, 0.5],
  Lc: [0.7, 5.0, 2.2], Ln: [-0.1, 0, 1], fR: [0, 0, 0.5], fL: [0, 0, -0.4] };
const NAMES = Object.keys(GUARD);
const full = o => Object.assign({}, GUARD, o);

function makeFighter(name, x, facing) {
  const wrap = new T.Group();
  wrap.position.x = x;
  wrap.rotation.y = facing > 0 ? Math.PI / 2 : -Math.PI / 2;
  wrap.scale.setScalar(SCALE);
  scene.add(wrap);
  const { rig, B } = buildRig();
  wrap.add(rig);
  rig.updateMatrixWorld(true);
  const F = { name, wrap, rig, B, hipRest: B.Bone_Hips.position.clone(), wpn: null, shd: null, hasShield: false, pose: GUARD };
  F.ankleRest = {
    R: rig.worldToLocal(B.Bone_Ankle_R.getWorldPosition(new T.Vector3())),
    L: rig.worldToLocal(B.Bone_Ankle_L.getWorldPosition(new T.Vector3())) };
  F.setGear = (wk, sh) => {
    if (F.wpn) B.Bone_Hand_R.remove(F.wpn.grp);
    F.wpn = weaponGroup(wk); F.wpn.key = wk; B.Bone_Hand_R.add(F.wpn.grp);
    if (F.shd) { B.Bone_Hand_L.remove(F.shd.grp); F.shd = null; }
    if (sh) { F.shd = weaponGroup('escudo'); B.Bone_Hand_L.add(F.shd.grp); }
    F.hasShield = sh;
  };
  return F;
}

function applyPose(F, p) {
  const { B, rig } = F;
  F.pose = p;
  B.Bone_Hips.position.set(F.hipRest.x + p.hip[0], F.hipRest.y + p.hip[1], F.hipRest.z + p.hip[2]);
  B.Bone_Spine.rotation.set(p.sp[0], p.sp[1], p.sp[2]);
  B.Bone_Neck.rotation.set(p.nk[0], p.nk[1], p.nk[2]);
  rig.updateMatrixWorld(true);
  const fwdW = new T.Vector3(0, 0, 1).transformDirection(rig.matrixWorld);
  const upW = new T.Vector3(0, 1, 0);
  const pole = fwdW.clone().negate();

  // Pernas: pés plantados em alvos fixos, com passo definido pela animação.
  for (const s of ['R', 'L']) {
    const tgtRig = F.ankleRest[s].clone().add(new T.Vector3().fromArray(p['f' + s]));
    solveChain(B['Bone_UpperLeg_' + s], B['Bone_LowerLeg_' + s], B['Bone_Ankle_' + s],
      rig.localToWorld(tgtRig), fwdW);
  }
  // Braço da arma.
  const Gw = rig.localToWorld(new T.Vector3().fromArray(p.Rg));
  solveChain(B.Bone_Shoulder_R, B.Bone_Elbow_R, B.Bone_Hand_R, Gw, pole);
  const dirW = new T.Vector3().fromArray(p.Rd).transformDirection(rig.matrixWorld);
  orientEnd(B.Bone_Hand_R, quatFrame('y', dirW, fwdW));
  B.Bone_Hand_R.updateWorldMatrix(true, false);
  // Braço do escudo.
  const Lw = rig.localToWorld(new T.Vector3().fromArray(p.Lc));
  solveChain(B.Bone_Shoulder_L, B.Bone_Elbow_L, B.Bone_Hand_L, Lw, pole);
  const nW = new T.Vector3().fromArray(p.Ln).transformDirection(rig.matrixWorld);
  orientEnd(B.Bone_Hand_L, quatFrame('z', nW, upW));
  B.Bone_Hand_L.updateWorldMatrix(true, false);
}

/* ---------- Pontos de contato, medidos no estado real dos personagens ---------- */
function closestOnSeg(p, a, b) {
  const ab = b.clone().sub(a);
  const t = Math.max(0, Math.min(1, p.clone().sub(a).dot(ab) / ab.lengthSq()));
  return a.clone().addScaledVector(ab, t);
}
function contactPoint(def, kind, att) {
  if (kind === 'blade') {
    // Aparada: o ponto da lâmina do defensor mais próximo do punho do atacante.
    const bR = def.B.Bone_Hand_R;
    const G = bR.getWorldPosition(new T.Vector3());
    const dir = new T.Vector3(0, 1, 0).applyQuaternion(bR.getWorldQuaternion(new T.Quaternion()));
    const tip = G.clone().addScaledVector(dir, def.wpn.L * SCALE);
    const Ga = att ? att.B.Bone_Hand_R.getWorldPosition(new T.Vector3()) : G;
    return closestOnSeg(Ga, G, tip);
  }
  if (kind === 'shield') {
    const bL = def.B.Bone_Hand_L;
    const G = bL.getWorldPosition(new T.Vector3());
    const n = new T.Vector3(0, 0, 1).applyQuaternion(bL.getWorldQuaternion(new T.Quaternion()));
    return G.addScaledVector(n, 0.12 * SCALE);
  }
  return def.rig.localToWorld(new T.Vector3(0, 5.0, 1.3));
}
// Ajusta a direção da lâmina do atacante para que ela encoste no ponto de contato (suave no tempo).
function aimAttacker(att, def, kind, w) {
  const bR = att.B.Bone_Hand_R;
  const G = bR.getWorldPosition(new T.Vector3());
  const C = contactPoint(def, kind, att);
  const aim = C.clone().sub(G).normalize();
  const keyW = new T.Vector3().fromArray(att.pose.Rd).transformDirection(att.rig.matrixWorld);
  const dirW = keyW.lerp(aim, w).normalize();
  const fwdW = new T.Vector3(0, 0, 1).transformDirection(att.rig.matrixWorld);
  orientEnd(bR, quatFrame('y', dirW, fwdW));
  bR.updateWorldMatrix(true, false);
}
function segDist(p, a, b) {
  const ab = b.clone().sub(a);
  const t = Math.max(0, Math.min(1, p.clone().sub(a).dot(ab) / ab.lengthSq()));
  return p.distanceTo(a.clone().addScaledVector(ab, t));
}
// Distância do ponto de contato às lâminas (mm) — prova de que as armas se tocam.
function measureContact(att, def, kind) {
  const C = contactPoint(def, kind, att);
  const bR = att.B.Bone_Hand_R;
  const Ga = bR.getWorldPosition(new T.Vector3());
  const da = new T.Vector3(0, 1, 0).applyQuaternion(bR.getWorldQuaternion(new T.Quaternion()));
  const dA = segDist(C, Ga, Ga.clone().addScaledVector(da, att.wpn.L * SCALE));
  let dD = 0;
  if (kind === 'blade') {
    const bd = def.B.Bone_Hand_R;
    const Gd = bd.getWorldPosition(new T.Vector3());
    const dd = new T.Vector3(0, 1, 0).applyQuaternion(bd.getWorldQuaternion(new T.Quaternion()));
    dD = segDist(C, Gd, Gd.clone().addScaledVector(dd, def.wpn.L * SCALE));
  }
  return { att: dA * 1000, def: dD * 1000 };
}

// Trilha: guarda no início + pontos deslocados por 'off' e escalados por 'k' (mesmo k para os dois → sincronia).
function track(keys, off, k) {
  const out = [[0, GUARD]];
  for (const [t, o] of keys) out.push([(off + t) * k, full(o)]);
  return out;
}
function evalKeys(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const a = keys[i - 1], b = keys[i];
      const u = (t - a[0]) / (b[0] - a[0]);
      const s = 0.5 - 0.5 * Math.cos(Math.PI * u);
      const o = {};
      for (const n of NAMES) {
        if (Array.isArray(a[1][n])) o[n] = a[1][n].map((v, j) => v + (b[1][n][j] - v) * s);
      }
      return o;
    }
  }
  return keys[keys.length - 1][1];
}
const sm = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const contactWeight = (t, Ti) => sm((t - (Ti - 0.22)) / 0.22) * (1 - sm((t - Ti) / 0.3));

function buildInter(mode, I, D) {
  const inter = { tracks: [], dur: 0, impact: null, kind: null, label: '', desc: '' };
  if (mode === 'sh') {
    const O = I.hasShield ? I : D.hasShield ? D : null;
    if (!O) return null;
    inter.tracks.push([O, track(REACT.block, LEAD + 0.9, 1)]);
    inter.impact = LEAD + 0.9; inter.label = 'Escudo bloqueia'; inter.desc = 'Sequência do escudo: ' + O.name;
    inter.shieldOnly = true;
  } else {
    const S = STYLE[I.wpn.key];
    inter.tracks.push([I, track(S.A, LEAD, S.k)]);
    let R, kind, lab;
    if (mode === 'hit') { R = REACT.hit; kind = 'chest'; lab = 'Golpe certeiro'; }
    else if (D.hasShield) { R = REACT.block; kind = 'shield'; lab = 'Bloqueado com escudo'; }
    else if (S.kind === 'thrust') { R = REACT.dodge; kind = null; lab = 'Esquiva'; }
    else { R = REACT.parry; kind = 'blade'; lab = 'Aparado com a arma'; }
    const reactTi = S.Ti;
    inter.tracks.push([D, track(R, LEAD + reactTi, S.k)]);
    inter.impact = (LEAD + reactTi) * S.k;
    inter.kind = kind; inter.label = lab; inter.attackTi = (LEAD + reactTi) * S.k;
    inter.att = I; inter.def = D;
    inter.desc = S.name + ' — ' + I.name;
  }
  inter.dur = Math.max(...inter.tracks.map(([, tr]) => tr[tr.length - 1][0]));
  return inter;
}

/* ---------- Instâncias ---------- */
const A = makeFighter('Personagem A', -D_SEP / 2 * SCALE, 1);
const B = makeFighter('Personagem B', D_SEP / 2 * SCALE, -1);
const WKEYS = ['khopesh', 'reta', 'curva', 'adaga', 'machado'];
const WNAMES = { khopesh: 'Khopesh', reta: 'Espada reta', curva: 'Espada curva', adaga: 'Adaga', machado: 'Machado' };
A.setGear('reta', false);
B.setGear('curva', true);

/* ---------- Locomoção: passos com IK nos pés, 8 direções ---------- */
const BASE_YAW = { 'Personagem A': Math.PI / 2, 'Personagem B': -Math.PI / 2 };
const WALK = { on: false, F: A, wv: 0, phase: 0, freq: 0.9, speed: 1, mode: 'strafe', theta: 0, dl: [0, 1] };
// Ângulo em relação à frente do personagem: 90 = direita (lado do braço da arma), -90 = esquerda.
function setWalkDir(theta) {
  WALK.theta = theta;
  const r = theta * Math.PI / 180;
  WALK.dl = [-Math.sin(r), Math.cos(r)];
}
function walkPose() {
  const dl = WALK.mode === 'turn' ? [0, 1] : WALK.dl;
  const stride = 1.1 + 1.1 * Math.abs(dl[1]); // passo mais curto quando o movimento é lateral
  const ph = WALK.phase, w = WALK.wv;
  const fr = v => v - Math.floor(v);
  const front = [dl[0] * stride / 2, dl[1] * stride / 2], back = [-front[0], -front[1]];
  const out = full({});
  for (const [s, off] of [['R', 0], ['L', 0.5]]) {
    const u = fr(ph + off);
    let x, y, z;
    if (u < 0.5) { // balanço: pé sai de trás e vai à frente, passando pelo ar
      const q = u / 0.5, e = q * q * (3 - 2 * q);
      x = back[0] + (front[0] - back[0]) * e; z = back[1] + (front[1] - back[1]) * e; y = Math.sin(Math.PI * q) * 0.45;
    } else { // apoio: pé fica plantado enquanto o corpo passa por cima
      const q = (u - 0.5) / 0.5;
      x = front[0] + (back[0] - front[0]) * q; z = front[1] + (back[1] - front[1]) * q; y = 0;
    }
    const g = GUARD['f' + s];
    out['f' + s] = [g[0] * (1 - w) + x * w, g[1] * (1 - w) + y * w, g[2] * (1 - w) + z * w];
  }
  const sw = Math.sin(2 * Math.PI * ph), bob = 0.5 - 0.5 * Math.cos(4 * Math.PI * ph);
  out.hip = [dl[0] * 0.15 * sw * w, -0.07 * bob * w, 0];
  out.sp = [GUARD.sp[0], 0, -0.05 * dl[0] * sw * w];
  return out;
}
// Avança o personagem no mundo com a mesma velocidade dos pés (pés plantados na fase de apoio).
function stepWalk(dt) {
  const target = WALK.on ? 1 : 0;
  WALK.wv += (target - WALK.wv) * Math.min(1, dt * 5);
  if (WALK.wv < 0.001) { WALK.wv = 0; return; }
  const F = WALK.F;
  const dl = WALK.mode === 'turn' ? [0, 1] : WALK.dl;
  const stride = 1.1 + 1.1 * Math.abs(dl[1]);
  WALK.phase += WALK.freq * WALK.speed * dt;
  const v = 2 * stride * WALK.freq * WALK.speed * WALK.wv; // unidades do rig por segundo
  if (WALK.mode === 'turn') {
    const yawT = BASE_YAW[F.name] - WALK.theta * Math.PI / 180;
    F.wrap.rotation.y += (yawT - F.wrap.rotation.y) * Math.min(1, dt * 4);
  }
  const dir = new T.Vector3(dl[0], 0, dl[1]).applyQuaternion(F.wrap.quaternion);
  F.wrap.position.addScaledVector(dir, v * dt * SCALE);
}
function resetPositions() {
  for (const F of [A, B]) {
    F.wrap.position.x = (F === A ? -1 : 1) * D_SEP / 2 * SCALE;
    F.wrap.position.z = 0;
    F.wrap.rotation.y = BASE_YAW[F.name];
  }
}

/* ---------- Controle de linha do tempo ---------- */
let cur = null, t = 0, playing = false, fired = false, flashT = 0, lastC = null;
const flash = new T.Mesh(new T.SphereGeometry(0.06, 16, 12), new T.MeshBasicMaterial({ color: 0xffe9a8, transparent: true, opacity: 0 }));
scene.add(flash);
const status = s => { $('status').textContent = s; };
function stop() { cur = null; playing = false; t = 0; fired = false; flashT = 0; status(''); $('gap').textContent = ''; $('scrub').value = 0; renderAt(0, performance.now() / 1000); }

function idlePose(now) {
  return full({ hip: [0, Math.sin(now * 2.2) * 0.02, 0], sp: [0.05 + Math.sin(now * 2.2) * 0.012, 0, 0] });
}
// Renderiza um instante: ossos → IK → contato (se houver). Retorna medição de contato no instante.
function renderAt(time, now) {
  const info = { gap: null };
  const named = cur ? new Map(cur.tracks) : null;
  for (const F of [A, B]) {
    const tr = named && named.get(F);
    applyPose(F, tr ? evalKeys(tr, time) : (WALK.wv > 0.001 && F === WALK.F) ? walkPose() : idlePose(now));
  }
  if (cur && cur.kind) {
    const w = contactWeight(time, cur.attackTi);
    if (w > 0) {
      aimAttacker(cur.att, cur.def, cur.kind, w);
      if (w >= 0.999) { info.gap = measureContact(cur.att, cur.def, cur.kind); lastC = contactPoint(cur.def, cur.kind, cur.att); }
    }
  }
  return info;
}

function regear() {
  A.setGear($('wA').value, $('sA').checked);
  B.setGear($('wB').value, $('sB').checked);
  stop();
}
['wA', 'sA', 'wB', 'sB'].forEach(i => $(i).addEventListener('change', regear));
['mode', 'init'].forEach(i => $(i).addEventListener('change', stop));
const selOpts = WKEYS.map(k => `<option value="${k}">${WNAMES[k]}</option>`).join('');
$('wA').innerHTML = selOpts; $('wB').innerHTML = selOpts;
$('wA').value = 'reta'; $('wB').value = 'curva';

$('play').onclick = () => {
  WALK.on = false; $('walk').textContent = 'Andar';
  if (!cur || t >= cur.dur) {
    const I = $('init').value === 'A' ? A : B, D = I === A ? B : A;
    const r = buildInter($('mode').value, I, D);
    if (!r) { status('Nenhum escudo equipado para esta sequência.'); return; }
    cur = r; t = 0; fired = false; lastC = null;
    status(r.desc + '…');
  }
  playing = true;
};
$('pause').onclick = () => { playing = false; };
$('reset').onclick = () => { WALK.on = false; WALK.wv = 0; resetPositions(); stop(); };
setWalkDir(0);
$('wdir').addEventListener('change', e => setWalkDir(+e.target.value));
$('wmode').addEventListener('change', e => { WALK.mode = e.target.value; });
$('wspd').addEventListener('input', e => { WALK.speed = e.target.value / 100; });
$('wwho').addEventListener('change', e => { WALK.on = false; WALK.F = e.target.value === 'A' ? A : B; });
$('walk').onclick = () => {
  if (WALK.on) { WALK.on = false; $('walk').textContent = 'Andar'; return; }
  stop();
  WALK.F = $('wwho').value === 'A' ? A : B;
  WALK.on = true; $('walk').textContent = 'Parar';
};
$('scrub').oninput = e => {
  if (!cur) return;
  t = e.target.value / 1000 * cur.dur;
  fired = t >= cur.impact;
  playing = false;
};
addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  ren.setSize(innerWidth, innerHeight);
});

/* ---------- Loop ---------- */
const clk = new T.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clk.getDelta(), 0.05);
  const now = performance.now() / 1000;
  if (!cur && !window.__freezeWalk) stepWalk(dt);
  if (cur && playing) {
    t += dt;
    if (t >= cur.dur) { t = cur.dur; playing = false; }
  }
  const info = renderAt(cur ? t : 0, now);
  if (cur) {
    if (!fired && t >= cur.impact) {
      fired = true; flashT = 0.45;
      status(cur.label + ' — ' + cur.desc);
    }
    if (info.gap) {
      $('gap').textContent = 'Contato: lâmina do atacante a ' + info.gap.att.toFixed(1) + ' mm' + (cur.kind === 'blade' ? ' · lâmina do defensor a ' + info.gap.def.toFixed(1) + ' mm' : '');
    }
    $('scrub').value = t / cur.dur * 1000;
  }
  if (lastC && flashT > 0) {
    flashT -= dt;
    const k = Math.max(0, flashT / 0.45);
    flash.position.copy(lastC);
    flash.material.opacity = k;
    flash.scale.setScalar(1 + (1 - k) * 1.5);
  } else flash.material.opacity = 0;
  ctl.update();
  ren.render(scene, cam);
}
renderAt(0, 0);
frame();
window.__dbg = {
  get cur() { return cur; }, set cur(v) { cur = v; },
  get t() { return t; }, set t(v) { t = v; },
  get playing() { return playing; }, set playing(v) { playing = v; },
  get fired() { return fired; }, set fired(v) { fired = v; },
  A, B, WALK, renderAt, buildInter, resetPositions, stepWalk, setWalkDir, regear, stop, ctl, cam, T, $,
  contactPoint, measureContact, STYLE, REACT
};
</script></body></html>
